name: Build & release

# Push a tag like v2.1.0 to build installers and attach them to the GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: bracket-maker-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Bracket Maker $TAG" --notes "Installers for macOS and Windows."
          gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Build .pkg
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          V=$(node -p "require('./package.json').version")
          scripts/make-pkg.sh "$B/macos/Bracket Maker.app" "$B/Bracket Maker_${V}_universal.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: bracket-maker-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/*.pkg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Bracket Maker $TAG" --notes "Installers for macOS and Windows."
          gh release upload "$TAG" $B/dmg/*.dmg $B/*.pkg --clobber
