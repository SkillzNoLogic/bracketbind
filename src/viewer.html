<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Live Tournament</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/js/viewer.js"></script>
</head>
<body class="viewer">
    <div class="ambient"><i></i><i></i><i></i><i></i></div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#34c759" />
                <stop offset="1" stop-color="#0a84ff" />
            </linearGradient>
        </defs>
    </svg>
    <div class="v-shell">
        <header class="v-bar glass">
            <div class="brand-mark"><i data-icon="trophy"></i></div>
            <div class="grow">
                <h1 id="v-title">Bracket Maker</h1>
                <small id="v-sub">Connecting…</small>
            </div>
            <span class="v-live" id="v-live"><span class="live-dot"></span><span id="v-live-text">Connecting</span></span>
        </header>
        <main id="v-main"></main>
    </div>
</body>
</html>
